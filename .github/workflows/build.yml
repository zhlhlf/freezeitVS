name: Build

# push          -> 只做测试编译（两个架构都编，产出 artifact，不发任何东西）
# workflow_dispatch -> 测试编译 + 建 GitHub Release（手动触发）
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:
    inputs:
      release:
        description: '编译完成后创建 GitHub Release'
        type: boolean
        default: true
      apk_url:
        description: '可选：配套 APP 的 APK 直链（留空则自动抓取同版本发布包里的 APK）'
        type: string
        default: ''
      prerelease:
        description: '标记为 pre-release'
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NDK_VERSION: r26d
  NDK_CACHE: ${{ github.workspace }}/.ndk-cache
  NDK_ROOT: ${{ github.workspace }}/.ndk
  PROJECT_DIR: freezeitVS

jobs:
  # ---------------------------------------------------------------- 编译（两种触发都跑）
  build:
    name: 编译 ARM64 + X64
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      zip_name: ${{ steps.ver.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取模块版本
        id: ver
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          prop() { sed -n "s/^$1=//p" magisk/module.prop | head -1 | tr -d '\r'; }
          ID="$(prop id)"; VERSION="$(prop version)"; VC="$(prop versionCode)"
          {
            echo "version=$VERSION"
            echo "version_code=$VC"
            echo "zip_name=${ID}_v${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"
          echo "模块 $ID  $VERSION ($VC)"

      - name: 缓存 Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_CACHE }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: 安装 Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          if [ ! -x "$NDK_CACHE/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            ZIP="android-ndk-${NDK_VERSION}-linux.zip"
            curl -fL --retry 3 -o "$ZIP" \
              "https://dl.google.com/android/repository/${ZIP}"
            rm -rf "$NDK_CACHE"
            # 直接从压缩包解出裸目录，省掉一层 mv
            unzip -q "$ZIP" "android-ndk-${NDK_VERSION}/toolchains/*" -d "$NDK_CACHE.tmp"
            mv "$NDK_CACHE.tmp/android-ndk-${NDK_VERSION}" "$NDK_CACHE"
            rm -rf "$NDK_CACHE.tmp" "$ZIP"
          fi
          # clang++ 用 --sysroot 相对自身定位，可直接软链到固定的 NDK_ROOT
          ln -sfn "$NDK_CACHE" "$NDK_ROOT"
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version | head -1

      - name: 获取配套 APP 的 APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          APK_URL: ${{ inputs.apk_url }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -uo pipefail
          if ls magisk/*.apk >/dev/null 2>&1; then
            echo "使用仓库内已有 APK"
          elif [ -n "${APK_URL:-}" ]; then
            echo "从 apk_url 下载"
            curl -fL --retry 3 -o "magisk/freezeit_${VERSION}_release.apk" "$APK_URL" || true
          else
            echo "尝试从官方发布包提取同版本 APK"
            ZIP_URL="https://raw.githubusercontent.com/jark006/freezeitRelease/main/freezeit_v${VERSION}.zip"
            if curl -fL --retry 2 -o /tmp/upstream.zip "$ZIP_URL"; then
              unzip -o -j /tmp/upstream.zip 'freezeit*.apk' -d magisk/ || true
            fi
          fi
          if ls magisk/*.apk >/dev/null 2>&1; then
            echo "✔ APK 就绪: $(ls magisk/*.apk)"
          else
            echo "::warning::未取得 APK，模块仍可安装，但需手动安装配套 APP"
          fi

      - name: 编译并打包
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_NDK_ROOT: ${{ env.NDK_ROOT }}
        run: |
          set -euo pipefail
          chmod +x build_linux.sh
          ./build_linux.sh "$GITHUB_WORKSPACE/dist"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: 校验产物
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/dist/${{ steps.ver.outputs.zip_name }}"
          test -f "$ZIP" || { echo "::error::缺少产物 $ZIP"; exit 1; }
          for arch in ARM64 X64; do
            f="magisk/freezeit${arch}"
            test -f "$f" || { echo "::error::缺少二进制 $f"; exit 1; }
            file "$f"
            file "$f" | grep -q 'ARM aarch64\|x86-64' || { echo "::error::$f 架构异常"; exit 1; }
          done
          unzip -l "$ZIP"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.zip_name }}
          path: dist/${{ steps.ver.outputs.zip_name }}
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布（仅手动触发）
  release:
    name: 创建 Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.zip_name }}
          path: dist

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ARGS=(--title "${VERSION}" --notes-file freezeitVS/changelog.txt)
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
          # 已存在同名 release 则覆盖资产，避免重复触发失败
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ZIP_NAME" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "dist/$ZIP_NAME" "${ARGS[@]}" -R "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY"
